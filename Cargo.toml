[package]
name = "ai-agents-with-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
anyhow = "1"
base64 = "0.22"
chrono = "=0.4.45"
dotenvy = "0.15"
rig = { version = "=0.46.0", default-features = false, features = ["reqwest"] }
rand = "0.8"
resvg = "=0.45.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.10.0", default-features = false, features = [
    "schemars",
    "client",
    "server",
    "auth",
    "macros",
    "elicitation",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-std",
    "net",
    "signal",
    "time",
] }
